name: CE Filter Compare (ETH Regime + RS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: CE filter compare chalayen
        run: python ce_filter_compare.py

      - name: Results commit + push karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ce_filter_compare_RESULTS.txt
          git commit -m "CE Buy-Only filter compare (ETH regime + RS) report" || echo "Koi naya result nahi (pehle jaisa hi)"
          git pull --rebase --autostash origin main
          git push
