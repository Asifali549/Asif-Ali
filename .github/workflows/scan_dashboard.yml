name: Scheduled Dashboard Scan

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard scan
        run: python scheduled_dashboard_scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_signals.json
          git diff --staged --quiet || git commit -m "Auto-update dashboard signals ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
