name: Scheduled Crypto Scan

on:
  schedule:
    # Har 15 minute baad (GitHub Actions ka minimum interval hai 5 min,
    # lekin busy waqt par thoda delay ho sakta hai - ye normal hai)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # Manually bhi "Run workflow" button se chala sakte hain

permissions:
  contents: write   # latest_signals.json ko commit/push karne ke liye zaroori

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled scan
        run: python scheduled_scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_signals.json
          git diff --staged --quiet || git commit -m "Auto-update signals ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push