name: Confluence Score Improvements Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: Confluence improvements test chalayen
        run: python confirm_confluence_improvements.py

      - name: Results commit + push karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add confirm_confluence_improvements_RESULTS.txt
          git commit -m "Confluence score improvements - walk-forward test results" || echo "Koi naya result nahi (pehle jaisa hi)"
          git push
