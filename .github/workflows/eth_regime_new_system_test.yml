name: ETH Regime NEW System Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas numpy

      - name: Asli comparison chalao
        run: python compare_eth_regime_new_system.py

      - name: Result file ko repo mein commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eth_regime_new_system_result.txt 2>/dev/null || true
          if [ -f eth_regime_new_system_ERROR.txt ]; then git add eth_regime_new_system_ERROR.txt; fi
          git diff --staged --quiet || git commit -m "ETH regime NEW system result - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push