name: CE Buy-Only Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: CE Buy-Only diagnostic chalayen
        run: python ce_buyonly_diagnostic.py

      - name: Results commit + push karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ce_buyonly_diagnostic_RESULTS.txt
          git commit -m "CE Buy-Only diagnostic report" || echo "Koi naya result nahi (pehle jaisa hi)"
          git push