name: Top Liquid Walk-Forward Test (No ETH Filter)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas numpy

      - name: Asli test chalao
        run: python compare_top_liquid_walkforward_no_eth.py

      - name: Result file ko repo mein commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add top_liquid_walkforward_no_eth_result.txt 2>/dev/null || true
          if [ -f top_liquid_walkforward_no_eth_ERROR.txt ]; then git add top_liquid_walkforward_no_eth_ERROR.txt; fi
          git diff --staged --quiet || git commit -m "Top liquid walk-forward (no ETH) result - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
