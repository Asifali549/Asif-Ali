name: Auto-Scan Trade Bot (Dummy/Paper - 5 Systems)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# Ek waqt mein sirf EK auto-bot run chale (do zanjeerein na banein).
concurrency:
  group: auto-scan-trade-bot
  cancel-in-progress: false

jobs:
  auto_scan_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-scan trade bot
        env:
          # Dashboard ke "Rokein / Chalayein" button ki taaza halat GitHub se parhne ke liye
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python auto_scan_trade_bot.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auto_bot_state.json
          if [ -f auto_bot_closed_trades.csv ]; then git add auto_bot_closed_trades.csv; fi
          git diff --staged --quiet && exit 0
          git commit -m "Auto-scan trade bot update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push kamyab (koshish $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push nakam, dobara koshish..."; sleep $((i * 5))
          done
          echo "Push 5 dafa nakam raha"; exit 1

      # ERROR aaye tab bhi chalega (zanjeer na toote); sirf aap ke "Cancel" par ruke ga.
      - name: Wait 5 minutes (hifazati waqfa)
        if: ${{ !cancelled() }}
        run: sleep 300

      - name: Agla scan khud shuru karein
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --retry 3 --retry-delay 10 -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/auto_scan_trade_bot.yml/dispatches \
            -d '{"ref":"main"}'
