name: Long-Term Walk-Forward Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas numpy

      - name: Logic tests chalao
        run: python test_walk_forward_splitter.py

      - name: Asli long-term test chalao
        run: python long_term_walkforward_test.py

      - name: Result file ko repo mein commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add long_term_walkforward_result.txt 2>/dev/null || true
          if [ -f long_term_walkforward_ERROR.txt ]; then git add long_term_walkforward_ERROR.txt; fi
          git diff --staged --quiet || git commit -m "Long-term walk-forward result - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push