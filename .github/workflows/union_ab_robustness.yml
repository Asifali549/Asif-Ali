name: Union AB Robustness Test

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Union AB robustness framework
        run: python union_ab_robustness.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add union_ab_robustness_RESULTS.txt
          git diff --staged --quiet && exit 0
          git commit -m "Union AB robustness framework results"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push kamyab (koshish $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push nakam, dobara koshish..."; sleep $((i * 5))
          done
          echo "Push 5 dafa nakam raha"; exit 1
