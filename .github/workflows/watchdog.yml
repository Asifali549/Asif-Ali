name: Watchdog

on:
  # Har 30 minute (khud) - agar koi loop ruk gaya ho to yahi ise
  # dobara zinda karega. workflow_dispatch se manually bhi test kar
  # sakte hain.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # dusre workflows ko workflow_dispatch se chalane ke liye zaroori

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watchdog.py
