name: Market Breadth Filter Test

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python market_breadth_test.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result_breadth.txt
          git diff --staged --quiet || git commit -m "Market breadth filter test result"
          git pull --rebase origin main
          git push