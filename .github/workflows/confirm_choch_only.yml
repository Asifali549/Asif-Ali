name: Confirm CHoCH-Only (Large Sample + Period Split)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run confirmation test (CHoCH-Only, 300 coins, period split)
        run: python confirm_choch_only.py
