name: Test Pending Tiers (CE Buy-Only Mult6 + Union AB Backup Tier)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pending tiers test
        run: python test_pending_tiers.py

      - name: Show results file
        if: always()
        run: cat test_pending_tiers_RESULTS.txt || echo "Results file nahi mili"
