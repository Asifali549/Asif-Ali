name: Coin 4h Trend Filter Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install ccxt pandas numpy

      - name: Logic tests chalao
        run: python test_coin_trend_filter.py

      - name: Asli comparison chalao
        run: python compare_coin_trend_filter.py

      - name: Result file ko repo mein commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coin_trend_filter_result.txt 2>/dev/null || true
          if [ -f coin_trend_filter_ERROR.txt ]; then git add coin_trend_filter_ERROR.txt; fi
          git diff --staged --quiet || git commit -m "Coin 4h trend filter result - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push